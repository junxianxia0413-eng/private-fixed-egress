{% extends "base.html" %}
{% block title %}登录 · Private Network{% endblock %}
{% block body %}
<main class="auth-layout">
  <section class="auth-intro">
    <p class="eyebrow">PRIVATE NETWORK</p>
    <h1>你的网络。<br>固定的出口。</h1>
    <p class="muted">登录以查看控制台与网络状态。</p>
    <span class="pill">Private Fixed-Egress Network Manager</span>
  </section>
  <section class="panel auth-panel" aria-labelledby="login-heading">
    <p class="eyebrow">管理员控制台</p>
    <h2 id="login-heading">欢迎回来</h2>
    <p class="muted">使用管理员账户安全登录。</p>
    {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
    <form method="post" action="/login">
      <input type="hidden" name="csrf" value="{{ csrf }}">
      <label for="username">用户名</label>
      <input id="username" name="username" autocomplete="username" maxlength="64" required autofocus>
      <label for="password">密码</label>
      <input id="password" name="password" type="password" autocomplete="current-password" maxlength="256" required>
      <button class="primary" type="submit">登录控制台 <span aria-hidden="true">→</span></button>
    </form>
    <p class="fine">仅授权管理员可访问。</p>
  </section>
</main>
{% endblock %}
