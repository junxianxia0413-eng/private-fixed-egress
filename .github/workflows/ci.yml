name: Controller CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  controller:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip check
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m pytest -q
      - run: bash -n deploy/install_controller.sh deploy/upgrade_controller.sh gateways/bootstrap.sh
      - run: shellcheck deploy/install_controller.sh deploy/upgrade_controller.sh gateways/bootstrap.sh

